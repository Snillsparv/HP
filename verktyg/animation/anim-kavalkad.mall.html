<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="utf-8">
<title>Ordkavalkad</title>
<style>
  /* Deterministisk animation styrd av window.SEEK(t). Kort efter kort i
     eskalerande tempo, avslut med totalsiffran. */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 540px; height: 960px; overflow: hidden; }
  body {
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background: linear-gradient(180deg, #f8fafc 0%, #eef2ff 100%);
    color: #1a1a2e;
    position: relative;
  }
  .bgword { position: absolute; left: 0; top: 0; color: #cbd5e1; font-weight: 700; opacity: 0.3;
    white-space: nowrap; will-change: transform; }

  .cardwrap { position: absolute; left: 50%; top: 50%; width: 0; height: 0; }
  .kort { position: absolute; left: -220px; top: -160px; width: 440px; min-height: 320px;
    background: #fff; border-radius: 20px; box-shadow: 0 22px 60px rgba(15, 23, 42, 0.14);
    padding: 44px 36px; text-align: center; display: flex; flex-direction: column;
    justify-content: center; gap: 16px; will-change: transform, opacity; }
  .kort .eyebrow { font-size: 14px; font-weight: 800; letter-spacing: 0.2em; color: #2563eb;
    text-transform: uppercase; }
  .kort .ord { font-size: 46px; font-weight: 800; line-height: 1.05; overflow-wrap: anywhere; }
  .kort .skilje { width: 54px; height: 4px; border-radius: 2px; background: #2563eb; margin: 2px auto; }
  .kort .betydelse { font-size: 25px; color: #475569; line-height: 1.3; }

  .slut { position: absolute; left: 0; top: 0; width: 540px; height: 960px; text-align: center; }
  .slut .antal { position: absolute; top: 380px; width: 100%; font-size: 96px; font-weight: 800;
    color: #1a1a2e; letter-spacing: -0.01em; will-change: transform, opacity; }
  .slut .antal small { display: block; font-size: 34px; font-weight: 800; color: #475569;
    letter-spacing: 0.06em; margin-top: 4px; }
  .slut .pill { position: absolute; top: 588px; width: 100%; will-change: transform, opacity; }
  .slut .pill span { display: inline-block; font-size: 27px; font-weight: 800; color: #fff;
    background: #2563eb; border-radius: 999px; padding: 14px 36px;
    box-shadow: 0 12px 30px rgba(37, 99, 235, 0.35); }
</style>
</head>
<body>
  <div id="bg"></div>
  <div class="cardwrap"><div class="kort" id="kort">
    <div class="eyebrow">Ordträningen</div>
    <div class="ord" id="ord"></div>
    <div class="skilje"></div>
    <div class="betydelse" id="betydelse"></div>
  </div></div>
  <div class="slut">
    <div class="antal" id="antal">4 136<small>HP-ORD</small></div>
    <div class="pill" id="pill"><span>hpakuten.se/ord</span></div>
  </div>

<script>
  const WORDS = __WORDS__;

  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const easeOutCubic = p => 1 - Math.pow(1 - p, 3);
  const easeOutBack = p => { const c = 1.70158; return 1 + (c + 1) * Math.pow(p - 1, 3) + c * Math.pow(p - 1, 2); };

  // ---------- Tidsschema ----------
  // Kort k visas d_k sekunder; tempot ökar geometriskt ner till golvet.
  const START = 0.30;      // första kortet landar
  const CUT = 7.55;        // när kavalkaden klipper till slutplattan
  const DURATION = 9.5;
  const sched = [];
  { let t = START, k = 0;
    while (t < CUT && k < WORDS.length) {
      const d = Math.max(0.92 * Math.pow(0.868, k), 0.066);
      sched.push({ t0: t, d });
      t += d; k++;
    } }
  const N = sched.length;

  // ---------- Bakgrundsord ----------
  const BG = ['efemär','prekär','lakonisk','obsolet','gängse','vederhäftig','eklektisk','altruism',
    'sinekur','dogmatisk','paradigm','utopi','apati','koncis','nogräknad','vedermöda','förment','gemen'];
  const bgEls = [];
  { const bg = document.getElementById('bg');
    for (let i = 0; i < BG.length; i++) {
      const el = document.createElement('div');
      el.className = 'bgword';
      el.textContent = BG[i];
      el.style.fontSize = (14 + (i * 7) % 12) + 'px';
      bg.appendChild(el);
      bgEls.push({ el, x: ((i * 137) % 24) * 22 + 8, y0: (i * 483) % 1160, v: 30 + (i * 7) % 12 });
    } }

  const $ = id => document.getElementById(id);
  const kortEl = $('kort'), ordEl = $('ord'), betEl = $('betydelse'),
    antalEl = $('antal'), pillEl = $('pill');

  window.READY = Promise.resolve();

  window.SEEK = function (t) {
    t = clamp(t, 0, DURATION);

    for (const w of bgEls) {
      let y = w.y0 - w.v * t;
      y = ((y % 1160) + 1160) % 1160 - 100;
      w.el.style.transform = 'translate(' + w.x + 'px,' + y + 'px)';
    }

    if (t < CUT) {
      // Hitta aktivt kort.
      let idx = 0;
      for (let k = 0; k < N; k++) if (t >= sched[k].t0) idx = k;
      const s = sched[idx];
      const w = WORDS[idx % WORDS.length];
      ordEl.textContent = w.w;
      betEl.textContent = w.d;

      // Entré: pop vars längd följer korttiden, sen stilla. I det snabba
      // partiet blir bytena hårda klipp med växlande lutning.
      const inDur = Math.min(0.22, s.d * 0.55);
      const p = clamp((t - s.t0) / inDur, 0, 1);
      const e = easeOutBack(p);
      const tilt = s.d < 0.24 ? ((idx % 2 === 0) ? 1 : -1) * 1.4 : 0;
      const pre = t < s.t0 + 0.0001 && idx === 0 && t < START;
      kortEl.style.opacity = pre ? 0 : (0.25 + 0.75 * p);
      kortEl.style.transform =
        'translateY(' + (26 * (1 - e)) + 'px) scale(' + (0.93 + 0.07 * e) + ') rotate(' + tilt + 'deg)';
      antalEl.style.opacity = 0; pillEl.style.opacity = 0;
    } else {
      kortEl.style.opacity = 0;
      const p1 = easeOutBack(clamp((t - CUT) / 0.55, 0, 1));
      antalEl.style.opacity = clamp((t - CUT) / 0.25, 0, 1);
      antalEl.style.transform = 'scale(' + Math.max(0.6 + 0.4 * p1, 0.001) + ')';
      const p2 = easeOutBack(clamp((t - CUT - 0.45) / 0.5, 0, 1));
      pillEl.style.opacity = clamp((t - CUT - 0.45) / 0.3, 0, 1);
      pillEl.style.transform = 'scale(' + Math.max(p2, 0.001) + ')';
    }
  };
  window.SEEK(0);
</script>
</body>
</html>
