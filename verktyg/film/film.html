<script>
'use strict';
window.DURATION = 32.05;

// =====================================================================
// Hjälpfunktioner
// =====================================================================
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const lerp = (a, b, p) => a + (b - a) * p;
const P = (t, a, b) => clamp((t - a) / (b - a));
const E = {
  inCubic: p => p * p * p,
  inQuad: p => p * p,
  outCubic: p => 1 - Math.pow(1 - p, 3),
  outQuart: p => 1 - Math.pow(1 - p, 4),
  outQuint: p => 1 - Math.pow(1 - p, 5),
  outExpo: p => (p >= 1 ? 1 : 1 - Math.pow(2, -10 * p)),
  inOutCubic: p => (p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2),
  inOutQuint: p => (p < 0.5 ? 16 * p ** 5 : 1 - Math.pow(-2 * p + 2, 5) / 2),
  inOutSine: p => -(Math.cos(Math.PI * p) - 1) / 2,
  outBack: p => { const c = 1.7; return 1 + (c + 1) * Math.pow(p - 1, 3) + c * Math.pow(p - 1, 2); },
  // Fjäder med ungefär tolv procents översväng som landar i 1 vid p = 1.
  spring: p => (p >= 1 ? 1 : 1 - Math.exp(-5.2 * p) * Math.cos(7.6 * p)),
};
const $ = id => document.getElementById(id);
const el = (tag, cls, parent, html) => {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (html != null) e.innerHTML = html;
  (parent || document.body).appendChild(e);
  return e;
};
const syns = (e, on) => { e.style.visibility = on ? 'visible' : 'hidden'; };
// Placerar ett element med mittpunkten i (x, y).
function put(e, x, y, s = 1, r = 0, o = 1) {
  if (o <= 0.001) { e.style.visibility = 'hidden'; return; }
  e.style.visibility = 'visible';
  e.style.transform = `translate(${x.toFixed(2)}px, ${y.toFixed(2)}px) translate(-50%, -50%) rotate(${r.toFixed(3)}deg) scale(${s.toFixed(4)})`;
  e.style.opacity = clamp(o).toFixed(3);
}
// Deterministiskt brus för små svävningar.
const wob = (t, f, ph) => Math.sin(t * f + ph) * 0.6 + Math.sin(t * f * 1.7 + ph * 2.3) * 0.4;
// Tal med mellanslag som tusentalsavgränsare, som på sajten (3 640).
const fmt = n => Math.round(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ' ');

  const e = $('tap');

  const inn = E.outCubic(P(t, t0 - 0.28, t0 - 0.06));

  const s = lerp(0.55, 1, inn) * (1 - 0.2 * ned * (1 - ut)) + 0.9 * ut;
  e.style.transform = `translate(${x.toFixed(2)}px, ${y.toFixed(2)}px) scale(${s.toFixed(3)})`;
  e.style.opacity = (inn * (1 - ut)).toFixed(3);
}

// Telefonens poser genom filmen. Varje pose nås vid t, rörelsen tar dur.
const POSER = [
  { t: 3.22, x: 270, y: 600, s: 1.00, ry: -9, rx: 5 },
  { t: 6.05, x: 270, y: 604, s: 1.00, ry: 8, rx: 4, dur: 0.7 },

  { t: 8.75, x: 214, y: 622, s: 0.92, ry: 6, rx: 4, dur: 0.6 },
  { t: 10.45, x: 300, y: 610, s: 0.96, ry: -7, rx: 4, dur: 0.7 },
  { t: 12.45, x: 270, y: 604, s: 1.00, ry: 8, rx: 4, dur: 0.7 },
  { t: 13.25, x: 318, y: 700, s: 0.82, ry: -18, rx: 7, dur: 0.6 },
  { t: 15.2, x: 270, y: 604, s: 1.00, ry: 7, rx: 4, dur: 0.5 },
  { t: 16.65, x: 270, y: 760, s: 0.8, ry: 10, rx: 8, dur: 0.55 },
  { t: 18.35, x: 270, y: 604, s: 1.00, ry: -8, rx: 4, dur: 0.7 },
  { t: 21.5, x: 214, y: 640, s: 0.92, ry: 12, rx: 5, dur: 0.55 },
  { t: 23.3, x: 270, y: 740, s: 0.84, ry: -6, rx: 7, dur: 0.6 },
];
function pose(t) {
  let i = 0;
  // i är den senast nådda posen; rörelsen mot nästa sker under dess dur.
  while (i + 1 < POSER.length && t >= POSER[i + 1].t) i++;
  const a = POSER[i], b = POSER[i + 1];
  if (!b || t <= a.t) return { ...a, svang: 0 };
  const d = b.dur || 0.7;
  const p = E.inOutCubic(P(t, b.t - d, b.t));
  const o = {};
  for (const k of ['x', 'y', 's', 'ry', 'rx']) o[k] = lerp(a[k], b[k], p);
  o.svang = Math.sin(Math.PI * p) * Math.min(1, Math.abs(b.ry - a.ry) / 18);
  o.svangP = p;
  return o;
}

// In med fjäder från en startpunkt. Ut: kortet krymper tillbaka dit det kom
// ifrån (in i telefonen) och förblir täckande tills det är litet, så att det
// aldrig blir dubbelexponerat över skärmen. Med opt.flyg flyger det i stället
// ut ur bild längs den vektorn.
function fall(t, e, inn, ut, fran, till, opt = {}) {
  const UT = 0.3;
  if (t < inn || t > ut + UT) { e.style.visibility = 'hidden'; return false; }
  const p = P(t, inn, inn + (opt.dur || 0.6));
  const sp = E.spring(p), op = E.outCubic(P(t, inn, inn + 0.05));
  const q = E.inOutCubic(P(t, ut, ut + UT));
  const fl = opt.flyt === false ? 0 : 1;
  let x = lerp(fran[0], till[0], sp) + fl * 2.2 * wob(t, 1.3, inn);
  let y = lerp(fran[1], till[1], sp) + fl * 3 * wob(t, 1.1, inn + 2);
  const mal = opt.flyg ? [x + opt.flyg[0], y + opt.flyg[1]] : fran;
  x = lerp(x, mal[0], q);
  y = lerp(y, mal[1], q);
  const s = lerp(opt.s0 != null ? opt.s0 : 0.45, opt.s || 1, sp) * lerp(1, opt.flyg ? 0.9 : 0.3, q);
  const r = lerp(opt.r0 || 0, opt.r || 0, sp) + fl * 0.5 * wob(t, 0.9, inn + 4);
  put(e, x, y, s, r, op * (1 - E.inCubic(P(t, ut + UT * (opt.flyg ? 0.5 : 0.6), ut + UT))));
  return true;
}

// ---------------- Intro (0 till 3.2) ----------------
// Telefonen börjar så stor att Jonas på skärmen ligger exakt där intro-Jonas
// står, och zoomar sedan ut. Ordmärket landar i sajtens logga.
const heroSkarm = [L.hero.x * K, STATUS + L.hero.y * K];
const ZX0 = 70 - S0 * (heroSkarm[0] - SW / 2);
const ZY0 = INTRO_Y - S0 * (heroSkarm[1] + 11 - PHONE_H / 2);
function zoom(t) {
  const zp = E.inOutCubic(P(t, ZOOM0, ZOOM1));
  return { x: lerp(ZX0, 270, zp), y: lerp(ZY0, 600, zp), s: lerp(S0, 1, zp), zp };
}
function intro(t) {
  const SK = S0 * K;
  const clip = $('introJonasClip'), jon = $('introJonas');
  const fade = 1 - P(t, ZOOM0 + 0.02, ZOOM0 + 0.16);
  if (fade <= 0) { syns(clip, false); syns($('introTag'), false); }
  else {
    syns(clip, true);
    // Mjuk nederkant (mask i CSS) som slutar under skrivbordet.
    clip.style.height = (INTRO_Y + 215 * SK + 80) + 'px';
    // Samma mått som bilden har på startsidan (280 x 215, lite utsträckt).
    jon.style.width = (L.hero.w * SK) + 'px';
    jon.style.height = (L.hero.h * SK) + 'px';
    // Redan på väg upp i första rutan, som är filmens omslagsbild.
    const upp = E.outBack(P(t, -0.3, 0.6));
    jon.style.transform = `translate(70px, ${(INTRO_Y + (1 - upp) * 330).toFixed(2)}px)`;
    clip.style.opacity = fade;
    const tg = $('introTag');
    const tp = E.spring(P(t, 0.95, 1.55));
    put(tg, 70 + (L.heroTag.x - L.hero.x + L.heroTag.w / 2) * SK, INTRO_Y + (L.heroTag.y - L.hero.y + L.heroTag.h / 2) * SK + (1 - tp) * 20, SK * lerp(0.9, 1, tp), 0, P(t, 0.95, 1.12) * fade);
  }
  // Ordmärket.
  const mk = $('mark');
  if (t >= ZOOM1) { syns(mk, false); return; }
  syns(mk, true);
  const starts = [0.62, 0.96, 1.16, 1.28, 1.36, 1.50, 1.58, 1.66, 1.82];
  for (let i = 0; i < mk.children.length; i++) {
    const p = P(t, starts[i], starts[i] + (i === 8 ? 0.26 : 0.42));
    const e = E.spring(p);
    const flytt = i === 8 ? `translateX(${(14 * (1 - E.outCubic(p))).toFixed(2)}px)` : `translateY(${(26 * (1 - e)).toFixed(2)}px)`;
    mk.children[i].style.transform = flytt + ` scale(${lerp(0.7, 1, e).toFixed(3)})`;
    mk.children[i].style.opacity = (E.outCubic(P(t, starts[i], starts[i] + 0.16)) * (i === 8 ? 1 - P(t, ZOOM0 + 0.28, ZOOM0 + 0.48) : 1)).toFixed(3);
  }
  const BIG = 3.1;
  const z = zoom(t);
  const [lx, ly] = skarmTillYta(L.logo.x * K, STATUS + (L.logo.y + 7.3) * K, z.x, z.y, z.s);
  // Ordmärket står överst i introt och glider in i loggan i sidhuvudet,
  // som då ligger på nästan samma höjd, så det korsar aldrig Jonas.
  const fly = E.inOutCubic(P(t, ZOOM0 - 0.12, ZOOM0 + 0.42));

  const sNu = lerp(BIG, z.s * K, fly);

// ---------------- Telefonen ----------------
function telefonen(t) {
  if (t < ZOOM0 || t > 25.7) { telefon({ o: 0 }); return; }
  const z = zoom(t);
  const po = pose(t);
  // Lutningen börjar först efter att ordmärket har landat i loggan.
  const lugn = E.inOutCubic(P(t, ZOOM1, ZOOM1 + 0.6));
  const b = {
    x: lerp(z.x, po.x, lugn), y: lerp(z.y, po.y, lugn), s: z.zp < 1 ? z.s : po.s,
    ry: po.ry * lugn + lugn * 2.5 * wob(t, 0.7, 1), rx: po.rx * lugn + lugn * 1.2 * wob(t, 0.6, 2),
    rz: lugn * 0.7 * wob(t, 0.5, 3), o: P(t, ZOOM0, ZOOM0 + 0.12), svang: po.svang, svangP: po.svangP,
  };
  b.y += lugn * 3.5 * wob(t, 0.9, 0.5);
  // Liten insats: telefonen sjunker ut ur bild.
  const ut = E.inCubic(P(t, 24.8, 25.55));
  b.y += 820 * ut; b.rx += 14 * ut;
  telefon(b);
}

// Scrollkurvorna per skärm (sajtens px). Hastigheten ger rörelseoskärpa.
const RAD9 = L.rad9[1] - 150;
const SCROLL = {
  hem: t => 880 * E.inOutCubic(P(t, 3.3, 4.7)),
  extra: t => 650 * E.inOutCubic(P(t, 6.05, 6.8)),
  ratt: t => RAD9 * E.inOutSine(P(t, 7.74, 8.1)) + 240 * E.inOutCubic(P(t, 8.45, 9.0)),
  matte: t => 170 + 180 * E.inOutCubic(P(t, 10.6, 11.2)),
  ord: t => 230 + 300 * E.inOutCubic(P(t, 19.25, 19.7)),
  ordkort: t => 300 + 260 * E.inOutCubic(P(t, 20.55, 21.1)),

// Lodrät oskärpa som en kamera med 180 graders slutare (1/120 s vid 60 bilder/s).
function oskarpa(id, t) {
  const h = 1 / 240;
  const v = Math.abs(SCROLL[id](t + h) - SCROLL[id](t - h)) / (2 * h) * K;   // skärmens px/s
  return Math.min(10, v / 120 / 4);
}
function skarmar(t) {
  const hem = SKARMAR.hem;
  if (hem.mask) hem.mask.style.opacity = t < ZOOM1 ? 1 : 0;
  const sc = id => SCROLL[id](t);

  } else if (t < 7.4) {

    }
  } else if (t < 10.06) {

    const oppen = P(t, 8.22, 8.31);
    if (t < 7.74) navigera(t, 7.3, 0.44, { id: 'extra', scroll: 650 }, { id: 'ratt', scroll: 0 });

    tryckSajt(t, 8.2, L.rad9[0], L.rad9[1], sc('ratt'));
  } else if (t < 11.95) {
    // Matterepetitionen: Pythagoras, tryck på 5, grön förklaring.
    const svar = P(t, 10.9, 10.98);
    if (t < 10.48) navigera(t, 10.06, 0.42, { id: 'ratt', scroll: RAD9 + 240, mix: 1 }, { id: 'matte', scroll: 170 });

    else visa('fokus', 0, 0, 0.18 * E.outCubic(P(t, 12.75, 13.2)) * (1 - P(t, 14.5, 14.84)));
  } else if (t < 17.9) {

    if (t < 15.27) navigera(t, 14.84, 0.42, { id: 'fokus', scroll: 0 }, { id: 'fraga', scroll: 0 });
    else if (t < 16.02) visa('fraga', 0, 0, 0, svar);
    else if (t < 16.49) navigera(t, 16.02, 0.47, { id: 'fraga', scroll: 0, mix: 1 }, { id: 'kvitto', scroll: 430 });
    else visa('kvitto', 430, 0, dim);
    const m = SKARMAR.fraga.markor[0];
    m.d.style.opacity = (E.outCubic(P(t, 15.2, 15.45)) * (1 - P(t, 15.8, 16.0))).toFixed(3);
    m.d.style.transformOrigin = '0 50%';
    m.d.style.transform = `scaleX(${E.outCubic(P(t, 15.2, 15.55)).toFixed(3)})`;
    tryckSajt(t, 15.86, L.mekRatt[0], L.mekRatt[1], 0);

// Ett tryck på en knapp i ett utfällt kort (sajtens px inom kortet).
function tryckKort(t, t0, kortEl, [sx, sy], s, r, [cx, cy]) {

  const dx = (sx - 24 - w / 2) * s, dy = (sy - 337 - h / 2) * s;
  const rad = r * Math.PI / 180;
  const x = cx + dx * Math.cos(rad) - dy * Math.sin(rad), y = cy + dx * Math.sin(rad) + dy * Math.cos(rad);
  const inn = E.outCubic(P(t, t0 - 0.28, t0 - 0.06)), ut = E.outCubic(P(t, t0, t0 + 0.45));

    put(e, x, y + dy * (1 - E.outCubic(p)), s * lerp(0.9, 1, E.outBack(p)), 0, E.outCubic(p) * o);
  };
  // Slutet tar över: texten lyfter och tonar bort.
  const bort = E.inOutCubic(P(t, 28.75, 29.35));
  const lyft = -150 * bort;
  // Den lilla pricken under "liten insats" blir en stor blå cirkel.
  const c = $('insCirkel');
  const dotIn = E.spring(P(t, 26.62, 26.95));
  // Pricken sväller på "en" och hela bilden är blå när STOR slår in.
  const grow = E.inOutQuint(P(t, 27.2, 27.56));
  const r = lerp(0.18 * dotIn, 12.5, grow) * (1 + 0.25 * Math.sin(Math.PI * P(t, 27.02, 27.2)));
  const cy = lerp(486, 480, grow);
  c.style.transform = `translate(270px, ${cy.toFixed(1)}px) scale(${r.toFixed(4)})`;
  // Minikorten på en ellips runt texten.
  miniEls.forEach((e, i) => {
    // Nedersta kortet först, det översta sist när undertexten har gått.
    const v = Math.PI / 2 + i * (2 * Math.PI / miniEls.length) + 0.18;
    const inn = E.spring(P(t, 24.95 + i * 0.05, 25.55 + i * 0.05));
    const ihop = E.inOutCubic(P(t, 26.9, 27.22));
    const blas = E.outCubic(P(t, 27.22, 27.62));
    // Korten dras ihop mest lodrätt, så att de inte glider in i texten.
    const rx = 172 * (1 - 0.04 * ihop) * (1 + 1.4 * blas), ry = 318 * (1 - 0.14 * ihop) * (1 + 1.4 * blas);
    const ox = 270 + Math.cos(v) * rx + 4 * wob(t, 1.1, i);
    const oy = 470 + Math.sin(v) * ry + 5 * wob(t, 0.9, i + 3);
    const x = lerp(270, ox, Math.min(inn, 1.08)), y = lerp(720, oy, Math.min(inn, 1.08));
    const rot = (i % 2 ? 1 : -1) * (4 + (i * 3) % 5) + 2 * wob(t, 0.7, i);
    put(e, x, y, lerp(0.3, 0.85, inn) * (1 - 0.1 * ihop), rot, P(t, 24.95 + i * 0.05, 25.1 + i * 0.05) * (1 - blas) * 0.96);
  });
  // Före cirkeln: mörk text på ljus bakgrund.
  const forsta = 1 - P(t, 27.28, 27.48);
  ord(insEls.aven, 25.62, 270, 372 + lyft, 1, forsta);
  // Sägs stort och krymper medan "insats" uttalas: en liten insats.
  const krymp = E.inOutCubic(P(t, 26.52, 26.85));
  ord(insEls.liten, 26.26, 270, lerp(440, 452, krymp) + lyft, lerp(0.9, 0.26, krymp), forsta);
  ord(insEls.gor, 27.02, 270, 552 + lyft, 1, forsta);
  // STOR slår in när cirkeln fyller bilden.
  const sp = E.spring(P(t, 27.52, 27.95));
  put(insEls.stor, 270, 424 + lyft, lerp(1.6, 1, sp), 0, (t >= 27.52 ? 1 : 0) * (1 - bort));
  ord(insEls.skillnad, 27.98, 270, 548 + lyft, 1, 1 - bort, 30);
  // Lätt skakning i bild när STOR landar.
  const skak = Math.exp(-14 * Math.max(0, t - 27.56)) * (t > 27.56 ? 1 : 0);
  ins.style.transform = `translate(${(5 * skak * Math.sin(t * 90)).toFixed(2)}px, ${(4 * skak * Math.cos(t * 77)).toFixed(2)}px)`;
}

// ---------------- Lycka till på söndag! ----------------
const slutEls = {
  lycka: el('div', 'slutT', $('slut'), 'Lycka till'),
  sondag: el('div', 'slutT', $('slut'), 'på söndag!'),
};
slutEls.lycka.style.fontSize = '66px';
slutEls.sondag.style.cssText += 'font-size:66px;color:#fde68a;';
const CF_FARG = ['#fde68a', '#ffffff', '#f59e0b', '#93c5fd', '#34d399', '#f472b6', '#fbbf24'];
const confetti = [];
// Andra skuren: från länken när den landar.
for (let i = 0; i < 34; i++) {
  const e = el('div', 'cf', $('confetti'));
  e.style.width = (6 + (i * 5) % 5) + 'px'; e.style.height = (9 + (i * 3) % 7) + 'px';
  e.style.background = CF_FARG[(i + 3) % CF_FARG.length];
  e.style.borderRadius = i % 3 === 0 ? '50%' : '2px';
  const v = (i / 34) * 2 * Math.PI;
  const fart = 260 + ((i * 41) % 220);
  confetti.push({ e, x0: 270, y0: 382, vx: Math.cos(v) * fart, vy: Math.sin(v) * fart - 260,
    rot: (i * 53) % 360, vr: 300 + (i * 29) % 300, t0: 30.76 });
}
for (let i = 0; i < 90; i++) {
  const e = el('div', 'cf', $('confetti'));
  const w = 7 + (i * 7) % 6, h = 11 + (i * 5) % 8;
  e.style.width = w + 'px'; e.style.height = h + 'px';
  e.style.background = CF_FARG[i % CF_FARG.length];
  e.style.borderRadius = i % 3 === 0 ? '50%' : '2px';
  const sida = i % 2 ? 1 : -1;
  const vinkel = (-62 - ((i * 37) % 50)) * Math.PI / 180;
  const fart = 520 + ((i * 53) % 420);
  confetti.push({ e, x0: sida > 0 ? 560 : -20, y0: 700 + (i * 29) % 160, vx: -sida * Math.cos(vinkel) * fart * 0.62,
    vy: Math.sin(vinkel) * fart * 1.18, rot: (i * 47) % 360, vr: 260 + (i * 31) % 400, t0: 29.62 + (i % 9) * 0.025 });
}
function slut(t) {
  const s = $('slut');
  if (t < 28.7) { syns(s, false); $('slutJonas').style.filter = 'none'; return; }
  syns(s, true);
  $('slutJonas').style.filter = 'url(#klister) drop-shadow(0 20px 40px rgba(15, 23, 42, 0.35))';
  // Jonas vinkar upp ur bildkanten.
  // Uppåt med en mjuk kurva och en liten studs, så att bildens underkant
  // aldrig syns ovanför bildrutans kant.
  const jp = E.outCubic(P(t, 28.95, 29.55));
  const studs = 14 * Math.sin(P(t, 29.4, 29.9) * Math.PI) * (1 - P(t, 29.4, 29.9));
  const jw = 500, jh = jw * 1200 / 896;
  const jon = $('slutJonas');
  jon.style.width = jw + 'px';
  const vink = Math.sin((t - 29.6) * 7) * 3 * P(t, 29.6, 29.9);
  jon.style.transformOrigin = '50% 100%';
  jon.style.transform = `translate(${(540 - jw + 20).toFixed(1)}px, ${(960 - jh + 60 + (1 - jp) * 660 - studs).toFixed(1)}px) rotate(${vink.toFixed(2)}deg)`;
  jon.style.opacity = P(t, 28.95, 29.1).toFixed(3);
  // Texten.
  const tl = (e, t0, y) => {
    const p = P(t, t0 - 0.05, t0 + 0.35);
    put(e, 270, y + 26 * (1 - E.outCubic(p)), lerp(0.85, 1, E.spring(p)), 0, E.outCubic(p));
  };
  tl(slutEls.lycka, 29.62, 200);
  tl(slutEls.sondag, 30.48, 276);
  const pp = E.spring(P(t, 30.72, 31.22));
  put($('slutPill'), 270, 382 + (1 - pp) * 20, lerp(0.6, 1, pp), 0, P(t, 30.72, 30.82));
  // Konfetti.
  for (const c of confetti) {
    const dt = t - c.t0;
    if (dt < 0) { c.e.style.visibility = 'hidden'; continue; }
    c.e.style.visibility = 'visible';
    const x = c.x0 + c.vx * dt, y = c.y0 + c.vy * dt + 0.5 * 900 * dt * dt;
    c.e.style.transform = `translate(${x.toFixed(1)}px, ${y.toFixed(1)}px) rotate(${(c.rot + c.vr * dt).toFixed(1)}deg) rotateX(${(dt * 400 % 360).toFixed(1)}deg)`;
  }
}

// Allt är redo när bilderna och typsnitten har laddats.
window.SEEK = SEEK;
window.READY = Promise.all([
  document.fonts.ready,
  ...[...document.images].map(i => i.decode().catch(() => null)),
]).then(() => { SEEK(0); return true; });
</script>
