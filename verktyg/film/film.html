<!DOCTYPE html>

<head>

<title>HPAkuten på ett par timmar</title>
<link rel="stylesheet" href="../../src/styles/hjarnkarta.css">
<style>
  /* Deterministisk film som styrs helt av window.SEEK(t) från render.mjs.
     Inga CSS-animationer eller övergångar: varje bildruta räknas fram ur t.
     Ytan är 540 x 960 CSS-px och renderas med dubbel upplösning (1080 x 1920).
     Skärmbilderna i bilder/ är fångade från den riktiga sajten (fanga.mjs),
     hjärnkartan ritas med sajtens egen kod (hjarnkarta-vy.js). */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 540px; height: 960px; overflow: hidden; }
  body {
    --font-sans: 'Inter', 'Segoe UI', system-ui, sans-serif;
    font-family: var(--font-sans);
    color: #1a1a2e;
    background: #f8fafc;
    position: relative;
    -webkit-font-smoothing: antialiased;
  }
  .abs { position: absolute; left: 0; top: 0; will-change: transform, opacity; }
  img { display: block; user-select: none; }
  /* Sajtens CSS-animationer ersätts av tidsstyrda värden här. */
  .hk-puls, .hk-vax .hk-form, .hk-vax .hk-topp { animation: none !important; }

  /* ---------- Bakgrund ---------- */
  #bg { position: absolute; inset: 0; overflow: hidden;
    background: linear-gradient(172deg, #f8fafc 0%, #eef2ff 58%, #e0e7ff 100%); }
  #dots { position: absolute; left: -44px; top: -44px; width: 628px; height: 1048px;
    background-image: radial-gradient(rgba(37, 99, 235, 0.16) 1.15px, transparent 1.35px);
    background-size: 22px 22px; will-change: transform; }
  .blob { position: absolute; left: 0; top: 0; border-radius: 50%; will-change: transform; }
  #blob1 { width: 520px; height: 520px; background: radial-gradient(circle, rgba(37, 99, 235, 0.20), rgba(37, 99, 235, 0) 68%); }
  #blob2 { width: 460px; height: 460px; background: radial-gradient(circle, rgba(245, 158, 11, 0.16), rgba(245, 158, 11, 0) 68%); }
  #blob3 { width: 420px; height: 420px; background: radial-gradient(circle, rgba(147, 51, 234, 0.12), rgba(147, 51, 234, 0) 68%); }

  /* ---------- Intro ---------- */
  #introJonasClip { position: absolute; left: 0; top: 0; width: 540px; overflow: hidden;
    -webkit-mask-image: linear-gradient(#000 calc(100% - 80px), transparent); mask-image: linear-gradient(#000 calc(100% - 80px), transparent); }
  #introJonas { position: absolute; left: 0; top: 0; filter: drop-shadow(0 6px 16px rgba(0, 0, 0, 0.12)); }
  /* Exakt som .hero-tag på startsidan (390 px bred mobilvy), så att den
     smälter ihop med skärmbilden när telefonen tonar in. */
  #introTag { position: absolute; left: 0; top: 0; width: 342px; height: 52.4px; font-size: 12px; font-weight: 600;
    line-height: 20.4px; letter-spacing: 0.96px; text-align: center; text-transform: uppercase; color: #2563eb;
    border: 1px solid rgba(37, 99, 235, 0.4); border-radius: 50px; padding: 4.8px 12.8px;
    box-shadow: 0 0 10px rgba(37, 99, 235, 0.2), 0 0 20px rgba(37, 99, 235, 0.1); }
  #mark { position: absolute; left: 0; top: 0; white-space: nowrap; font-weight: 800; font-size: 20.8px;
    line-height: 1; transform-origin: 0 0; z-index: 30; }
  #mark span { display: inline-block; will-change: transform, opacity; }
  #mark .hp { color: #1a1a2e; }
  #mark .ak { color: #2563eb; }
  #mark .se { color: #94a3b8; }

  /* ---------- Telefonen ---------- */
  #phoneShadow { position: absolute; left: 0; top: 0; width: 300px; height: 80px; border-radius: 50%;
    background: radial-gradient(ellipse at center, rgba(15, 23, 42, 0.30), rgba(15, 23, 42, 0) 70%); }
  #phone { position: absolute; left: 0; top: 0; width: 322px; height: 672px; border-radius: 54px;
    padding: 2px; background: linear-gradient(140deg, #d6dae2 0%, #9aa1ad 35%, #e8ebf0 60%, #868d99 100%);
    box-shadow: 0 40px 80px rgba(15, 23, 42, 0.22), 0 14px 30px rgba(15, 23, 42, 0.14); will-change: transform; }
  #bezel { position: absolute; inset: 2px; border-radius: 52px; background: #0a0a0f; padding: 9px; }
  #screen { position: relative; width: 300px; height: 650px; border-radius: 43px; overflow: hidden;
    background: #fafafa; isolation: isolate; }
  .scr { position: absolute; left: 0; top: 0; width: 300px; height: 650px; overflow: hidden; background: #fafafa;
    will-change: transform, opacity; }
  .scr .page { position: absolute; left: 0; top: 0; width: 300px; will-change: transform; }
  .scr .page img { width: 300px; position: absolute; left: 0; top: 0; }
  .scr .hdr { position: absolute; left: 0; top: 38px; width: 300px; }
  .scr .mask { position: absolute; background: #fff; }
  .scr .dim { position: absolute; inset: 0; background: #0f172a; opacity: 0; }
  .mark2 { position: absolute; border-radius: 4px; background: rgba(253, 230, 138, 0.55); mix-blend-mode: multiply; }
  #status { position: absolute; left: 0; top: 0; width: 300px; height: 38px; background: #fff; z-index: 5;
    font-size: 13.5px; font-weight: 650; color: #111; }
  #status .tid { position: absolute; left: 34px; top: 13px; letter-spacing: -0.01em; }
  #status svg { position: absolute; top: 15px; }
  #island { position: absolute; left: 50%; top: 10px; width: 88px; height: 25px; margin-left: -44px;
    border-radius: 13px; background: #000; z-index: 6; }
  #homebar { position: absolute; left: 50%; bottom: 7px; width: 108px; height: 4px; margin-left: -54px;
    border-radius: 3px; background: #111; z-index: 6; opacity: 0.85; }
  #glare { position: absolute; left: -150px; top: -100px; width: 220px; height: 900px; z-index: 7; pointer-events: none;
    background: linear-gradient(90deg, rgba(255,255,255,0), rgba(255,255,255,0.28), rgba(255,255,255,0));
    opacity: 0; }
  /* Trycket syns både på vit botten och på blå knappar. */
  .tap { position: absolute; left: 0; top: 0; width: 40px; height: 40px; margin: -20px 0 0 -20px; border-radius: 50%;
    z-index: 8; background: rgba(255, 255, 255, 0.42); border: 3px solid #fff; opacity: 0;
    box-shadow: 0 0 0 2px rgba(15, 23, 42, 0.32), 0 4px 14px rgba(15, 23, 42, 0.32); }

  /* ---------- Utfällda kort ---------- */
  #pops { position: absolute; inset: 0; z-index: 10; }
  .pop { position: absolute; left: 0; top: 0; will-change: transform, opacity; transform-origin: 50% 50%; }
  .pop img { display: block; }
  .pop.skugga { box-shadow: 0 28px 60px rgba(15, 23, 42, 0.20), 0 8px 18px rgba(15, 23, 42, 0.10); }

  /* Hjärnkartan som ritas direkt i sidan på /trana/fokus. */
  .kartlager { position: absolute; left: 0; top: 0; width: 342px; transform-origin: 0 0; z-index: 3; }
  .kartlager .hk-kort { position: absolute; left: 0; top: 0; width: 342px; height: 452.7px; box-shadow: var(--shadow, 0 1px 3px rgba(0,0,0,.08), 0 1px 2px rgba(0,0,0,.06)); }
  /* Slöja bakom ordkorten. */
  #sloja { position: absolute; inset: 0; background: rgba(248, 250, 252, 0.86); }

  /* Ordkort i ordträningens stil (src/pages/ord.astro). */
  .ordkort { width: 330px; background: #fff; border: 1px solid #e2e8f0; padding: 14px 16px 16px; }
  .ordkort .topp { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  .ordkort .topp b { font-size: 26px; font-weight: 800; letter-spacing: -0.02em; color: #1a1a2e; }
  .ordkort .def { font-size: 14.5px; font-weight: 700; color: #1d4ed8; background: #eff6ff; border-radius: 8px; padding: 4px 10px; }
  .ordkort .mnemo { background: #fffbeb; border: 1px solid #fde68a; border-radius: 10px; padding: 9px 12px 10px;
    font-size: 15.5px; line-height: 1.45; color: #334155; }
  .ordkort .lbl { font-size: 11px; font-weight: 800; letter-spacing: 0.1em; text-transform: uppercase; color: #b45309; margin-bottom: 3px; }
  .ordkort .hook { background: #fef3c7; color: #92400e; font-weight: 800; border-radius: 3px; padding: 0 2px; }


  /* ---------- Liten insats, stor skillnad ---------- */
  #ins { position: absolute; left: 0; top: 0; width: 540px; height: 960px; z-index: 25; pointer-events: none; }
  #insCirkel { position: absolute; left: 0; top: 0; width: 100px; height: 100px; margin: -50px 0 0 -50px; border-radius: 50%;
    background: radial-gradient(circle at 40% 35%, #3b82f6, #2563eb 55%, #1d4ed8); will-change: transform; }
  .insT { position: absolute; left: 0; top: 0; white-space: nowrap; font-weight: 800; letter-spacing: -0.035em;
    will-change: transform, opacity; }

  /* ---------- Slutet ---------- */
  #slut { position: absolute; inset: 0; z-index: 26; pointer-events: none; }
  /* Filtret sätts i slut() bara när bilden syns: ett dolt element med
     SVG-filter ritar annars en svart ruta i hörnet i Chromium. */
  #slutJonas { position: absolute; left: 0; top: 0; }
  .cf { position: absolute; left: 0; top: 0; will-change: transform; }
  .slutT { position: absolute; left: 0; top: 0; white-space: nowrap; font-weight: 800; letter-spacing: -0.04em; color: #fff;
    will-change: transform, opacity; }
  /* Samma ordmärke som i introt och i sajtens sidhuvud. */
  #slutPill { position: absolute; left: 0; top: 0; white-space: nowrap; background: #fff;
    font-size: 44px; font-weight: 800; letter-spacing: -0.01em; line-height: 1; padding: 16px 40px; border-radius: 999px;
    box-shadow: 0 16px 36px rgba(15, 23, 42, 0.28); }
  #slutPill .hp { color: #1a1a2e; } #slutPill .ak { color: #2563eb; } #slutPill .se { color: #94a3b8; }
</style>

          <svg style="left:210px" width="18" height="11" viewBox="0 0 18 11"><rect x="0" y="7" width="3" height="4" rx="1" fill="#111"/><rect x="5" y="5" width="3" height="6" rx="1" fill="#111"/><rect x="10" y="2.5" width="3" height="8.5" rx="1" fill="#111"/><rect x="15" y="0" width="3" height="11" rx="1" fill="#111"/></svg>

<script src="hjarnkarta-vy.js"></script>

<script>
'use strict';
window.DURATION = 32.05;

// =====================================================================
// Hjälpfunktioner
// =====================================================================
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const lerp = (a, b, p) => a + (b - a) * p;
const P = (t, a, b) => clamp((t - a) / (b - a));
const E = {
  inCubic: p => p * p * p,
  inQuad: p => p * p,
  outCubic: p => 1 - Math.pow(1 - p, 3),
  outQuart: p => 1 - Math.pow(1 - p, 4),
  outQuint: p => 1 - Math.pow(1 - p, 5),
  outExpo: p => (p >= 1 ? 1 : 1 - Math.pow(2, -10 * p)),
  inOutCubic: p => (p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2),
  inOutQuint: p => (p < 0.5 ? 16 * p ** 5 : 1 - Math.pow(-2 * p + 2, 5) / 2),
  inOutSine: p => -(Math.cos(Math.PI * p) - 1) / 2,
  outBack: p => { const c = 1.7; return 1 + (c + 1) * Math.pow(p - 1, 3) + c * Math.pow(p - 1, 2); },
  // Fjäder med ungefär tolv procents översväng som landar i 1 vid p = 1.
  spring: p => (p >= 1 ? 1 : 1 - Math.exp(-5.2 * p) * Math.cos(7.6 * p)),
};
const $ = id => document.getElementById(id);
const el = (tag, cls, parent, html) => {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (html != null) e.innerHTML = html;
  (parent || document.body).appendChild(e);
  return e;
};
const syns = (e, on) => { e.style.visibility = on ? 'visible' : 'hidden'; };
// Placerar ett element med mittpunkten i (x, y).
function put(e, x, y, s = 1, r = 0, o = 1) {
  if (o <= 0.001) { e.style.visibility = 'hidden'; return; }
  e.style.visibility = 'visible';
  e.style.transform = `translate(${x.toFixed(2)}px, ${y.toFixed(2)}px) translate(-50%, -50%) rotate(${r.toFixed(3)}deg) scale(${s.toFixed(4)})`;
  e.style.opacity = clamp(o).toFixed(3);
}
// Deterministiskt brus för små svävningar.
const wob = (t, f, ph) => Math.sin(t * f + ph) * 0.6 + Math.sin(t * f * 1.7 + ph * 2.3) * 0.4;

// =====================================================================
// Tidslinje. Rösten (rost.mp3) bestämmer takten; nyckelorden och deras tider:
// hpakuten 0.66, timmar 3.86, redo 4.70, gamla prov 6.48, förklaringar 8.20,
// inte klarade 9.44, fräscha upp 10.44, matten 11.12, öva 12.90, svagaste
// 13.88, databasen 15.02, täpper 15.88, luckor 16.96, ordhjälpen 20.08,
// minnestekniker 21.44, komma ihåg 22.52, högskoleprovsord 23.74, liten 26.26,
// stor 27.56, lycka 29.65, söndag 30.6. Ingen manustext i bild: undertexter
// läggs på separat.
// =====================================================================

// =====================================================================
// Bakgrund
// =====================================================================
function bakgrund(t) {
  $('blob1').style.transform = `translate(${(-140 + 60 * Math.sin(t * 0.21)).toFixed(1)}px, ${(-120 + 50 * Math.cos(t * 0.17)).toFixed(1)}px)`;
  $('blob2').style.transform = `translate(${(250 + 50 * Math.cos(t * 0.19)).toFixed(1)}px, ${(560 + 60 * Math.sin(t * 0.23)).toFixed(1)}px)`;
  $('blob3').style.transform = `translate(${(-160 + 40 * Math.sin(t * 0.15 + 1)).toFixed(1)}px, ${(640 + 40 * Math.cos(t * 0.2)).toFixed(1)}px)`;
  $('dots').style.transform = `translate(${((t * 6) % 22).toFixed(2)}px, ${((-t * 9) % 22).toFixed(2)}px)`;
}

// =====================================================================
// Telefonen och dess skärmar
// =====================================================================
const SW = 300, SH = 650, STATUS = 38, K = SW / 390;   // sajtens CSS-px -> skärmens px
const PHONE_W = 322, PHONE_H = 672;
const SKARMAR = {};
function skarm(id, bilder, opt = {}) {
  const e = el('div', 'scr', $('screens'));
  const page = el('div', 'page', e);
  const imgs = bilder.map(s => { const i = el('img', '', page); i.src = 'bilder/' + s + '.png'; return i; });
  const markor = (opt.markor || []).map(m => {
    const d = el('div', 'mark2', page);
    d.style.left = (m.x * K) + 'px'; d.style.top = (m.y * K) + 'px';
    d.style.width = (m.w * K) + 'px'; d.style.height = (m.h * K) + 'px';
    return { d, ...m };
  });
  const hdr = el('img', 'hdr', e); hdr.src = 'bilder/sidhuvud.png';
  // En vit lapp över loggan medan introns ordmärke flyger dit.
  let mask = null;
  if (opt.loggmask) {
    mask = el('div', 'mask', e);
    mask.style.left = (20 * K) + 'px'; mask.style.top = (STATUS + 8 * K) + 'px';
    mask.style.width = (112 * K) + 'px'; mask.style.height = (42 * K) + 'px';
  }
  const dim = el('div', 'dim', e);
  // Vid dragspelet ligger den gamla bilden över den nya; markeringar och
  // annat som ritas i sidan ligger alltid överst.
  if (opt.vik) imgs[0].style.zIndex = 1;
  markor.forEach(m => { m.d.style.zIndex = 3; });
  SKARMAR[id] = { id, e, page, imgs, hdr, dim, mask, markor, vik: opt.vik };
  return SKARMAR[id];
}
// scroll i sajtens CSS-px; x i skärmens px; mix tonar in bild nr 2, 3 ...
function visa(id, scroll = 0, x = 0, dim = 0, mix = 0, blur = 0) {
  const s = SKARMAR[id];
  if (blur > 0.3) {
    $('rorelseS').setAttribute('stdDeviation', '0 ' + blur.toFixed(2));
    s.page.style.filter = 'url(#rorelse)';
  } else s.page.style.filter = 'none';
  // inherit, inte visible: annars syns skärmen fast telefonen är dold.
  s.e.style.visibility = 'inherit';
  s.e.style.transform = `translateX(${x.toFixed(2)}px)`;
  s.page.style.transform = `translateY(${(STATUS - scroll * K).toFixed(2)}px)`;
  if (s.vik && s.imgs.length === 2) {
    // Som ett dragspel: det nya blocket (vik.h högt) fälls ut vid vik.y och
    // allt under glider ned, i stället för att två sidor tonas över varandra.
    const [a, b] = s.imgs, p = clamp(mix);
    const grans = (s.vik.y + s.vik.h * p) * K;
    b.style.opacity = p > 0 ? 1 : 0;
    b.style.clipPath = p > 0 && p < 1 ? `inset(0 0 calc(100% - ${grans.toFixed(2)}px) 0)` : 'none';
    a.style.opacity = p < 1 ? 1 : 0;
    a.style.clipPath = p > 0 ? `inset(${(s.vik.y * K).toFixed(2)}px 0 0 0)` : 'none';
    a.style.transform = `translateY(${(s.vik.h * p * K).toFixed(2)}px)`;
  } else s.imgs.forEach((b, i) => { b.style.opacity = i === 0 ? 1 : clamp(mix - (i - 1)).toFixed(3); });
  s.dim.style.opacity = dim.toFixed(3);
}
function dolj() { for (const s of Object.values(SKARMAR)) { s.e.style.visibility = 'hidden'; s.e.style.zIndex = 0; s.e.style.boxShadow = 'none'; s.page.style.filter = 'none'; } }
// Navigering som i iOS: den nya sidan skjuts in från höger.
function navigera(t, t0, dur, fran, till) {
  const p = E.inOutCubic(P(t, t0, t0 + dur));
  visa(fran.id, fran.scroll || 0, -SW * 0.28 * p, 0.14 * p, fran.mix || 0);
  visa(till.id, till.scroll || 0, SW * (1 - p), 0, till.mix || 0);
  // Skuggan tonar in och ut, så att den inte slår på i första bilden.
  const sk = 0.16 * Math.sin(Math.PI * p);
  SKARMAR[till.id].e.style.boxShadow = sk > 0.001 ? `-12px 0 26px rgba(15,23,42,${sk.toFixed(3)})` : 'none';
  SKARMAR[till.id].e.style.zIndex = 2;
  SKARMAR[fran.id].e.style.zIndex = 1;
}
// Ett tryck: fingret sänks, trycker och släpper en våg. x, y i skärmens px.
function tryck(t, t0, x, y) {
  const e = $('tap');
  if (t < t0 - 0.28 || t > t0 + 0.45) return;
  const inn = E.outCubic(P(t, t0 - 0.28, t0 - 0.06));
  const ned = P(t, t0 - 0.06, t0);
  const ut = E.outCubic(P(t, t0, t0 + 0.45));
  const s = lerp(0.55, 1, inn) * (1 - 0.2 * ned * (1 - ut)) + 0.9 * ut;
  e.style.transform = `translate(${x.toFixed(2)}px, ${y.toFixed(2)}px) scale(${s.toFixed(3)})`;
  e.style.opacity = (inn * (1 - ut)).toFixed(3);
}
// Tryck på en punkt i sajtens koordinater på en sida som är scrollad sc.
const tryckSajt = (t, t0, x, y, sc) => tryck(t, t0, x * K, STATUS + (y - sc) * K);

// Bara 2D-transformer: med perspektiv ritar Chromium telefonen från en
// lågupplöst bild, som blir suddig när kameran zoomar in.
function telefon(b) {
  const ph = $('phone');
  if (b.o <= 0.001) { ph.style.visibility = 'hidden'; $('phoneShadow').style.visibility = 'hidden'; return; }
  ph.style.visibility = 'visible';
  ph.style.transform = `translate(${(b.x - PHONE_W / 2).toFixed(2)}px, ${(b.y - PHONE_H / 2).toFixed(2)}px) rotate(${b.rz.toFixed(3)}deg) scale(${b.s.toFixed(4)})`;
  ph.style.opacity = b.o.toFixed(3);
  const sh = $('phoneShadow');
  sh.style.visibility = 'visible';
  sh.style.transform = `translate(${(b.x - 150).toFixed(2)}px, ${(b.y + PHONE_H * b.s / 2 - 34).toFixed(2)}px) scale(${(b.s * 1.05).toFixed(3)}, ${(b.s * 0.9).toFixed(3)})`;
  sh.style.opacity = (b.o * 0.9).toFixed(3);
  // Ett ljusskimmer över glaset vid de stora svängarna.
  const g = $('glare');
  const sv = Math.abs(b.svang || 0);
  g.style.opacity = (0.9 * sv).toFixed(3);
  g.style.transform = `translateX(${(-60 + 560 * (b.svangP || 0)).toFixed(1)}px) rotate(18deg)`;
}
// Var en punkt på skärmen hamnar på ytan, när telefonen inte lutar.
const skarmTillYta = (px, py, x, y, s) => [x + s * (px - SW / 2), y + s * (py + 11 - PHONE_H / 2)];

// Kameran. Telefonen syns i början och slutet; däremellan är skärmen
// inzoomad så att sajten fyller bilden (helskärm). FS är skalan där skärmens
// bredd fyller bilden och statusraden hamnar precis ovanför bildkanten.
const FS_S = 1.81;
const SKARM_TOPP = STATUS, SKARM_BOTTEN = 646;
// Telefonens läge så att skärmpunkten (px, py) hamnar i (cx, cy) vid skalan s,
// begränsat så att skärmen alltid täcker hela bilden.
function sikta(px, py, s, cx = 270, cy = 480) {
  let x = cx - s * (px - SW / 2), y = cy - s * (py + 11 - PHONE_H / 2);
  x = clamp(x, 540 - s * SW / 2, s * SW / 2);
  y = clamp(y, 960 - s * (SKARM_BOTTEN + 11 - PHONE_H / 2), -s * (SKARM_TOPP + 11 - PHONE_H / 2));
  return { x, y, s };
}
const FS = sikta(SW / 2, SKARM_TOPP, FS_S, 270, 0);
// Inzoomning med sidhuvudet kvar överst: skärmens topp i bildens överkant.
function siktaTopp(px, s) {
  const x = clamp(270 - s * (px - SW / 2), 540 - s * SW / 2, s * SW / 2);
  return { x, y: -s * (SKARM_TOPP + 11 - PHONE_H / 2), s };
}
const TELEFON = { x: 270, y: 490, s: 1 };
// Sajtens koordinater (CSS-px) till skärmens, för en sida som är scrollad sc.
const skarmPt = (x, y, sc) => [x * K, STATUS + (y - sc) * K];

function skapaKamera() {
  // Helskärm hela vägen genom sajten. Bara minnesregeln (ordkortet scrollat
  // 630) får en inzoomning, så att den fyller bildens bredd.
  const regel = siktaTopp(skarmPt(195, 0, 0)[0], 2.0);
  return [
    { t: 3.0, ...TELEFON },
    { t: 3.85, ...TELEFON },
    { t: 4.65, ...FS },
    { t: 21.6, ...FS },
    { t: 22.25, ...regel },
    { t: 24.0, ...regel },
    { t: 24.9, x: 270, y: 600, s: 0.95 },
  ];
}
const KAMERA = skapaKamera();
function kamera(t) {
  let i = 0;
  while (i + 1 < KAMERA.length && t >= KAMERA[i + 1].t) i++;
  const a = KAMERA[i], b = KAMERA[i + 1];
  if (!b || t <= a.t) return { ...a };
  const p = E.inOutCubic(P(t, a.t, b.t));
  const o = {};
  for (const k of ['x', 'y', 's']) o[k] = lerp(a[k], b[k], p);
  return o;
}

// =====================================================================
// Utfällda kort

const pop = (cls, html) => el('div', 'pop ' + (cls || ''), $('pops'), html);
// In med fjäder från en startpunkt. Ut: kortet krymper tillbaka dit det kom
// ifrån (in i telefonen) och förblir täckande tills det är litet, så att det
// aldrig blir dubbelexponerat över skärmen. Med opt.flyg flyger det i stället
// ut ur bild längs den vektorn.
function fall(t, e, inn, ut, fran, till, opt = {}) {
  const UT = 0.3;
  if (t < inn || t > ut + UT) { e.style.visibility = 'hidden'; return false; }
  const p = P(t, inn, inn + (opt.dur || 0.6));
  const sp = E.spring(p), op = E.outCubic(P(t, inn, inn + 0.05));
  const q = E.inOutCubic(P(t, ut, ut + UT));
  const fl = opt.flyt === false ? 0 : 1;
  let x = lerp(fran[0], till[0], sp) + fl * 2.2 * wob(t, 1.3, inn);
  let y = lerp(fran[1], till[1], sp) + fl * 3 * wob(t, 1.1, inn + 2);
  const mal = opt.flyg ? [x + opt.flyg[0], y + opt.flyg[1]] : fran;
  x = lerp(x, mal[0], q);
  y = lerp(y, mal[1], q);
  const s = lerp(opt.s0 != null ? opt.s0 : 0.45, opt.s || 1, sp) * lerp(1, opt.flyg ? 0.9 : 0.3, q);
  const r = lerp(opt.r0 || 0, opt.r || 0, sp) + fl * 0.5 * wob(t, 0.9, inn + 4);
  put(e, x, y, s, r, op * (1 - E.inCubic(P(t, ut + UT * (opt.flyg ? 0.5 : 0.6), ut + UT))));
  return true;
}

// Pulsringen runt vinnarpunkten (sajtens hk-puls, 1,6 s).

}
// MEK lyser upp när "svagaste punkter" sägs.
function framhav(t, root, t0, t1) {
  const p = E.outCubic(P(t, t0, t0 + 0.3)) * (1 - P(t, t1, t1 + 0.3));
  root.querySelectorAll('.hk-etk').forEach(b => {
    const mek = b.dataset.dp === 'mek';

    b.style.boxShadow = mek && p > 0 ? `0 0 0 ${(4 * p).toFixed(1)}px rgba(245,158,11,${(0.35 * p).toFixed(2)}), 0 0 ${(22 * p).toFixed(0)}px rgba(245,158,11,${(0.55 * p).toFixed(2)})` : '';
    b.style.scale = mek ? (1 + 0.06 * p).toFixed(3) : '1';

// =====================================================================
// SEEK: hela bildrutan som en funktion av tiden

const ZOOM0 = 2.2, ZOOM1 = 2.98;
const S0 = 400 / (L.hero.w * K);                  // telefonens skala i början av utzoomningen
const INTRO_Y = 282;                              // intro-Jonas överkant
function SEEK(t) {

// ---------------- Intro (0 till 3.2) ----------------
// Telefonen börjar så stor att Jonas på skärmen ligger exakt där intro-Jonas
// står, och zoomar sedan ut. Ordmärket landar i sajtens logga.
const heroSkarm = [L.hero.x * K, STATUS + L.hero.y * K];
const ZX0 = 70 - S0 * (heroSkarm[0] - SW / 2);
const ZY0 = INTRO_Y - S0 * (heroSkarm[1] + 11 - PHONE_H / 2);
function zoom(t) {
  const zp = E.inOutCubic(P(t, ZOOM0, ZOOM1));
  return { x: lerp(ZX0, TELEFON.x, zp), y: lerp(ZY0, TELEFON.y, zp), s: lerp(S0, TELEFON.s, zp), zp };
}
function intro(t) {
  const SK = S0 * K;
  const clip = $('introJonasClip'), jon = $('introJonas');
  const fade = 1 - P(t, ZOOM0 + 0.02, ZOOM0 + 0.16);
  if (fade <= 0) { syns(clip, false); syns($('introTag'), false); }
  else {
    syns(clip, true);
    // Mjuk nederkant (mask i CSS) som slutar under skrivbordet.
    clip.style.height = (INTRO_Y + 215 * SK + 80) + 'px';
    // Samma mått som bilden har på startsidan (280 x 215, lite utsträckt).
    jon.style.width = (L.hero.w * SK) + 'px';
    jon.style.height = (L.hero.h * SK) + 'px';
    // Redan på väg upp i första rutan, som är filmens omslagsbild.
    const upp = E.outBack(P(t, -0.3, 0.6));
    jon.style.transform = `translate(70px, ${(INTRO_Y + (1 - upp) * 330).toFixed(2)}px)`;
    clip.style.opacity = fade;
    const tg = $('introTag');
    const tp = E.spring(P(t, 0.95, 1.55));
    put(tg, 70 + (L.heroTag.x - L.hero.x + L.heroTag.w / 2) * SK, INTRO_Y + (L.heroTag.y - L.hero.y + L.heroTag.h / 2) * SK + (1 - tp) * 20, SK * lerp(0.9, 1, tp), 0, P(t, 0.95, 1.12) * fade);
  }
  // Ordmärket.
  const mk = $('mark');
  if (t >= ZOOM1) { syns(mk, false); return; }
  syns(mk, true);
  const starts = [0.62, 0.96, 1.16, 1.28, 1.36, 1.50, 1.58, 1.66, 1.82];
  for (let i = 0; i < mk.children.length; i++) {
    const p = P(t, starts[i], starts[i] + (i === 8 ? 0.26 : 0.42));
    const e = E.spring(p);
    const flytt = i === 8 ? `translateX(${(14 * (1 - E.outCubic(p))).toFixed(2)}px)` : `translateY(${(26 * (1 - e)).toFixed(2)}px)`;
    mk.children[i].style.transform = flytt + ` scale(${lerp(0.7, 1, e).toFixed(3)})`;
    mk.children[i].style.opacity = (E.outCubic(P(t, starts[i], starts[i] + 0.16)) * (i === 8 ? 1 - P(t, ZOOM0 + 0.28, ZOOM0 + 0.48) : 1)).toFixed(3);
  }
  const BIG = 3.1;
  const z = zoom(t);
  const [lx, ly] = skarmTillYta(L.logo.x * K, STATUS + (L.logo.y + 7.3) * K, z.x, z.y, z.s);
  // Ordmärket står överst i introt och glider in i loggan i sidhuvudet,
  // som då ligger på nästan samma höjd, så det korsar aldrig Jonas.
  const fly = E.inOutCubic(P(t, ZOOM0 - 0.12, ZOOM0 + 0.42));
  const bigX = 270 - (mk.offsetWidth * BIG) / 2, bigY = 150;   // hela "HPAkuten.se" centrerat
  const sNu = lerp(BIG, z.s * K, fly);
  mk.style.transform = `translate(${lerp(bigX, lx, fly).toFixed(2)}px, ${lerp(bigY, ly, fly).toFixed(2)}px) scale(${sNu.toFixed(4)})`;
}

// ---------------- Telefonen ----------------
function telefonen(t) {
  if (t < ZOOM0 || t > 25.7) { telefon({ o: 0 }); return; }
  const z = zoom(t);
  const k = kamera(t);
  // Kameran tar över först efter att ordmärket har landat i loggan.
  const lugn = E.inOutCubic(P(t, ZOOM1, ZOOM1 + 0.6));
  // Svävningen bara när telefonen syns, aldrig i helskärm.
  const sv = lugn * (1 - clamp((k.s - 1) / 0.5));
  const b = {
    x: lerp(z.x, k.x, lugn), y: lerp(z.y, k.y, lugn), s: z.zp < 1 ? z.s : k.s,
    rz: sv * 0.7 * wob(t, 0.5, 3), o: P(t, ZOOM0, ZOOM0 + 0.12), svang: 0,
  };
  b.y += sv * 3.5 * wob(t, 0.9, 0.5);
  // Liten insats: telefonen sjunker ut ur bild.
  const ut = E.inCubic(P(t, 24.9, 25.6));
  b.y += 820 * ut; b.s *= 1 - 0.1 * ut; b.rz -= 5 * ut;
  telefon(b);
}

// ---------------- Skärminnehållet ----------------
// En sak i taget: sidan scrollar lugnt, ett tryck, ett svar, sedan nästa sida.
// Scrollkurvorna per skärm (sajtens px). Hastigheten ger rörelseoskärpa.
const SCROLL = {
  hem: t => 0,
  extra: t => 700,
  ratt: t => 2250 + 150 * E.inOutCubic(P(t, 8.55, 9.15)),
  matte: t => 260 + 160 * E.inOutCubic(P(t, 11.05, 11.55)),
  fokus: t => 255,
  ord: t => 530 * E.inOutCubic(P(t, 18.85, 19.7)),
  ordkort: t => 300 + 330 * E.inOutCubic(P(t, 20.6, 21.2)),
};
// Lodrät oskärpa som en kamera med 180 graders slutare (1/120 s vid 60 bilder/s).
function oskarpa(id, t) {
  const h = 1 / 240;
  const v = Math.abs(SCROLL[id](t + h) - SCROLL[id](t - h)) / (2 * h) * K;   // skärmens px/s
  return Math.min(6, v / 120 / 6);
}
// Navigering tillbaka: den gamla sidan glider ut åt höger, den förra in från vänster.
function tillbaka(t, t0, dur, fran, till) {
  const p = E.inOutCubic(P(t, t0, t0 + dur));
  visa(till.id, till.scroll || 0, -SW * 0.28 * (1 - p), 0.14 * (1 - p), till.mix || 0);
  visa(fran.id, fran.scroll || 0, SW * p, 0, fran.mix || 0);
  const sk = 0.16 * Math.sin(Math.PI * p);
  SKARMAR[fran.id].e.style.boxShadow = sk > 0.001 ? `-12px 0 26px rgba(15,23,42,${sk.toFixed(3)})` : 'none';
  SKARMAR[fran.id].e.style.zIndex = 2;
  SKARMAR[till.id].e.style.zIndex = 1;
}
function skarmar(t) {
  const hem = SKARMAR.hem;
  if (hem.mask) hem.mask.style.opacity = t < ZOOM1 ? 1 : 0;
  const sc = id => SCROLL[id](t);
  if (t < 5.6) {
    // Startsidan: Jonas i helskärm.
    visa('hem', sc('hem'));
  } else if (t < 7.3) {
    // Gamla prov: passkorten från hösten 2025, tryck på Starta passet.
    if (t < 6.05) navigera(t, 5.58, 0.47, { id: 'hem', scroll: 0 }, { id: 'extra', scroll: 700 });
    else visa('extra', sc('extra'));
  } else if (t < 10.06) {
    // Rättningen: den röda fråga 9, tryck, förklaringen fälls ut.
    const oppen = E.outCubic(P(t, 8.12, 8.42));
    if (t < 7.74) navigera(t, 7.3, 0.44, { id: 'extra', scroll: 700 }, { id: 'ratt', scroll: 2250 });
    else visa('ratt', sc('ratt'), 0, 0, oppen, oskarpa('ratt', t));
  } else if (t < 11.95) {
    // Matterepetitionen: Pythagoras, tryck på 5, grön förklaring.
    const svar = E.outCubic(P(t, 10.88, 11.18));
    if (t < 10.48) navigera(t, 10.06, 0.42, { id: 'ratt', scroll: 2400, mix: 1 }, { id: 'matte', scroll: 260 });
    else visa('matte', sc('matte'), 0, 0, svar, oskarpa('matte', t));
  } else if (t < 14.84) {
    // Hjärnkartan: MEK lyser upp, sedan Kör 10 MEK-uppgifter.
    if (t < 12.42) navigera(t, 11.95, 0.47, { id: 'matte', scroll: 420, mix: 1 }, { id: 'fokus', scroll: 255 });
    else visa('fokus', sc('fokus'));
  } else if (t < 16.25) {
    // En MEK-uppgift ur databasen: 520 av den sorten, rätt svar.
    const svar = E.outCubic(P(t, 15.88, 16.18));
    if (t < 15.27) navigera(t, 14.84, 0.43, { id: 'fokus', scroll: 255 }, { id: 'fraga', scroll: 0 });
    else visa('fraga', 0, 0, 0, svar);
    const m = SKARMAR.fraga.markor[0];
    m.d.style.opacity = (E.outCubic(P(t, 15.25, 15.5)) * (1 - P(t, 15.8, 16.0))).toFixed(3);
    m.d.style.transformOrigin = '0 50%';
    m.d.style.transform = `scaleX(${E.outCubic(P(t, 15.25, 15.6)).toFixed(3)})`;
  } else if (t < 17.9) {
    // Tillbaka till kartan, där MEK-luckan fylls.
    if (t < 16.68) tillbaka(t, 16.25, 0.43, { id: 'fraga', scroll: 0, mix: 1 }, { id: 'fokus', scroll: 255 });
    else visa('fokus', sc('fokus'));
  } else if (t < 19.95) {
    // Ordträningen: ringen med ansiktet, ned till Starta passet.
    if (t < 18.37) navigera(t, 17.9, 0.47, { id: 'fokus', scroll: 255 }, { id: 'ord', scroll: 0 });
    else visa('ord', sc('ord'), 0, 0, 0, oskarpa('ord', t));
  } else {
    // Ett nytt ord, parlör, och minnesregeln; kameran går nära regeln.
    const regel = E.outCubic(P(t, 21.36, 21.66));
    if (t < 20.42) navigera(t, 19.95, 0.47, { id: 'ord', scroll: 530 }, { id: 'ordkort', scroll: 300 });
    else visa('ordkort', sc('ordkort'), 0, 0, regel, oskarpa('ordkort', t));
  }
  // Trycken ligger utanför grenarna, så att ringen tonar ut färdigt även när
  // sidan byts. Varje tryck syns bara kring sin egen tid.
  tryckSajt(t, 7.18, L.startaPasset[0], L.startaPasset[1], 700);
  tryckSajt(t, 8.1, L.rad9[0], L.rad9[1], sc('ratt'));
  tryckSajt(t, 10.86, L.matteA[0], L.matteA[1], sc('matte'));
  tryckSajt(t, 14.62, L.mekKnapp[0], L.mekKnapp[1], 255);
  tryckSajt(t, 15.86, L.mekRatt[0], L.mekRatt[1], 0);
  tryckSajt(t, 19.84, L.ordGo[0], L.ordGo[1], 530);
  tryckSajt(t, 21.34, L.visaRegel[0], L.visaRegel[1], sc('ordkort'));
  // Hjärnkartan i sidan: puls, MEK lyser, sedan växer MEK när luckan fylls.
  if (t >= 11.95 && t < 18.4) {
    ritaMek(lerp(FILMDATA.mekFore, FILMDATA.mekEfter, E.inOutCubic(P(t, 16.75, 17.35))));
    puls(t, kartLager);
    framhav(t, kortFore, 13.85, 14.3);
  }
}

// ---------------- Korten ----------------
// Bara ett utfällt ögonblick: två typiska högskoleprovsord med minnesregler.
function kort(t) {
  const sl = E.outCubic(P(t, 22.95, 23.25)) * (1 - E.inCubic(P(t, 24.65, 24.88)));
  $('sloja').style.opacity = sl.toFixed(3);
  syns($('sloja'), sl > 0.001);
  kOrdlista.forEach((e, i) => {
    fall(t, e, 23.06 + i * 0.45, 24.5, [270, 380 + i * 210 + 60], [270, 380 + i * 210], { s: 1.15, s0: 0.85, r0: 0, r: 0, dur: 0.6, flyt: false, flyg: [0, 40] });
  });
}

// ---------------- Även en liten insats gör en stor skillnad ----------------
// Små kort ur filmen svävar runt texten: alla små insatser. De dras ihop på
// "gör en" och blåses ut när den blå cirkeln slår ut på STOR.
const MINI = [['extra-kort', 150, 12], ['rattning-9-forklaring', 150, 10], ['ord-bild', 84, 12], ['matte-forklaring', 150, 12],
  ['ord-regel', 150, 12], ['fokus-kvitto-kort', 150, 16], ['matte-video', 150, 10], ['fokus-karta', 150, 16]];
const miniEls = MINI.map(([src, w, r]) => {
  const e = el('div', 'pop skugga', $('ins'));
  const i = el('img', '', e); i.src = 'bilder/' + src + '.png'; i.style.width = w + 'px'; i.style.borderRadius = r + 'px';
  e.style.borderRadius = r + 'px';
  return e;
});
const insCirkelEl = el('div', '', $('ins')); insCirkelEl.id = 'insCirkel';
const insEls = {
  aven: el('div', 'insT', $('ins'), 'Även en'),
  liten: el('div', 'insT', $('ins'), 'liten insats'),
  gor: el('div', 'insT', $('ins'), 'gör en'),
  stor: el('div', 'insT', $('ins'), 'STOR'),
  skillnad: el('div', 'insT', $('ins'), 'skillnad'),
};
// Lagerordning: den mörka texten under cirkeln, STOR och skillnad över den.
for (const e of [insCirkelEl, insEls.stor, insEls.skillnad]) $('ins').appendChild(e);
insEls.aven.style.cssText += 'font-size:58px;color:#0f172a;';
insEls.liten.style.cssText += 'font-size:58px;color:#2563eb;';
insEls.gor.style.cssText += 'font-size:58px;color:#0f172a;';
insEls.stor.style.cssText += 'font-size:168px;color:#fff;letter-spacing:-0.05em;line-height:1;';
insEls.skillnad.style.cssText += 'font-size:76px;color:#fff;letter-spacing:-0.04em;';
function insats(t) {
  const ins = $('ins');
  if (t < 24.9 || t > 32.1) { syns(ins, false); return; }
  syns(ins, true);
  const ord = (e, t0, x, y, s = 1, o = 1, dy = 22) => {
    const p = P(t, t0 - 0.06, t0 + 0.3);
    put(e, x, y + dy * (1 - E.outCubic(p)), s * lerp(0.9, 1, E.outBack(p)), 0, E.outCubic(p) * o);
  };
  // Slutet tar över: texten lyfter och tonar bort.
  const bort = E.inOutCubic(P(t, 28.75, 29.35));
  const lyft = -150 * bort;
  // Den lilla pricken under "liten insats" blir en stor blå cirkel.
  const c = $('insCirkel');
  const dotIn = E.spring(P(t, 26.62, 26.95));
  // Pricken sväller på "en" och hela bilden är blå när STOR slår in.
  const grow = E.inOutQuint(P(t, 27.2, 27.56));
  const r = lerp(0.18 * dotIn, 12.5, grow) * (1 + 0.25 * Math.sin(Math.PI * P(t, 27.02, 27.2)));
  const cy = lerp(486, 480, grow);
  c.style.transform = `translate(270px, ${cy.toFixed(1)}px) scale(${r.toFixed(4)})`;
  // Minikorten på en ellips runt texten.
  miniEls.forEach((e, i) => {
    // Nedersta kortet först, det översta sist när undertexten har gått.
    const v = Math.PI / 2 + i * (2 * Math.PI / miniEls.length) + 0.18;
    const inn = E.spring(P(t, 24.95 + i * 0.05, 25.55 + i * 0.05));
    const ihop = E.inOutCubic(P(t, 26.9, 27.22));
    const blas = E.outCubic(P(t, 27.22, 27.62));
    // Korten dras ihop mest lodrätt, så att de inte glider in i texten.
    const rx = 172 * (1 - 0.04 * ihop) * (1 + 1.4 * blas), ry = 318 * (1 - 0.14 * ihop) * (1 + 1.4 * blas);
    const ox = 270 + Math.cos(v) * rx + 4 * wob(t, 1.1, i);
    const oy = 470 + Math.sin(v) * ry + 5 * wob(t, 0.9, i + 3);
    const x = lerp(270, ox, Math.min(inn, 1.08)), y = lerp(720, oy, Math.min(inn, 1.08));
    const rot = (i % 2 ? 1 : -1) * (4 + (i * 3) % 5) + 2 * wob(t, 0.7, i);
    put(e, x, y, lerp(0.3, 0.85, inn) * (1 - 0.1 * ihop), rot, P(t, 24.95 + i * 0.05, 25.1 + i * 0.05) * (1 - blas) * 0.96);
  });
  // Före cirkeln: mörk text på ljus bakgrund.
  const forsta = 1 - P(t, 27.28, 27.48);
  ord(insEls.aven, 25.62, 270, 372 + lyft, 1, forsta);
  // Sägs stort och krymper medan "insats" uttalas: en liten insats.
  const krymp = E.inOutCubic(P(t, 26.52, 26.85));
  ord(insEls.liten, 26.26, 270, lerp(440, 452, krymp) + lyft, lerp(0.9, 0.26, krymp), forsta);
  ord(insEls.gor, 27.02, 270, 552 + lyft, 1, forsta);
  // STOR slår in när cirkeln fyller bilden.
  const sp = E.spring(P(t, 27.52, 27.95));
  put(insEls.stor, 270, 424 + lyft, lerp(1.6, 1, sp), 0, (t >= 27.52 ? 1 : 0) * (1 - bort));
  ord(insEls.skillnad, 27.98, 270, 548 + lyft, 1, 1 - bort, 30);
  // Lätt skakning i bild när STOR landar.
  const skak = Math.exp(-14 * Math.max(0, t - 27.56)) * (t > 27.56 ? 1 : 0);
  ins.style.transform = `translate(${(5 * skak * Math.sin(t * 90)).toFixed(2)}px, ${(4 * skak * Math.cos(t * 77)).toFixed(2)}px)`;
}

// ---------------- Lycka till på söndag! ----------------
const slutEls = {
  lycka: el('div', 'slutT', $('slut'), 'Lycka till'),
  sondag: el('div', 'slutT', $('slut'), 'på söndag!'),
};
slutEls.lycka.style.fontSize = '66px';
slutEls.sondag.style.cssText += 'font-size:66px;color:#fde68a;';
const CF_FARG = ['#fde68a', '#ffffff', '#f59e0b', '#93c5fd', '#34d399', '#f472b6', '#fbbf24'];
const confetti = [];
// Andra skuren: från länken när den landar.
for (let i = 0; i < 34; i++) {
  const e = el('div', 'cf', $('confetti'));
  e.style.width = (6 + (i * 5) % 5) + 'px'; e.style.height = (9 + (i * 3) % 7) + 'px';
  e.style.background = CF_FARG[(i + 3) % CF_FARG.length];
  e.style.borderRadius = i % 3 === 0 ? '50%' : '2px';
  const v = (i / 34) * 2 * Math.PI;
  const fart = 260 + ((i * 41) % 220);
  confetti.push({ e, x0: 270, y0: 382, vx: Math.cos(v) * fart, vy: Math.sin(v) * fart - 260,
    rot: (i * 53) % 360, vr: 300 + (i * 29) % 300, t0: 30.76 });
}
for (let i = 0; i < 90; i++) {
  const e = el('div', 'cf', $('confetti'));
  const w = 7 + (i * 7) % 6, h = 11 + (i * 5) % 8;
  e.style.width = w + 'px'; e.style.height = h + 'px';
  e.style.background = CF_FARG[i % CF_FARG.length];
  e.style.borderRadius = i % 3 === 0 ? '50%' : '2px';
  const sida = i % 2 ? 1 : -1;
  const vinkel = (-62 - ((i * 37) % 50)) * Math.PI / 180;
  const fart = 520 + ((i * 53) % 420);
  confetti.push({ e, x0: sida > 0 ? 560 : -20, y0: 700 + (i * 29) % 160, vx: -sida * Math.cos(vinkel) * fart * 0.62,
    vy: Math.sin(vinkel) * fart * 1.18, rot: (i * 47) % 360, vr: 260 + (i * 31) % 400, t0: 29.62 + (i % 9) * 0.025 });
}
function slut(t) {
  const s = $('slut');
  if (t < 28.7) { syns(s, false); $('slutJonas').style.filter = 'none'; return; }
  syns(s, true);
  $('slutJonas').style.filter = 'url(#klister) drop-shadow(0 20px 40px rgba(15, 23, 42, 0.35))';
  // Jonas vinkar upp ur bildkanten.
  // Uppåt med en mjuk kurva och en liten studs, så att bildens underkant
  // aldrig syns ovanför bildrutans kant.
  const jp = E.outCubic(P(t, 28.95, 29.55));
  const studs = 14 * Math.sin(P(t, 29.4, 29.9) * Math.PI) * (1 - P(t, 29.4, 29.9));
  const jw = 500, jh = jw * 1200 / 896;
  const jon = $('slutJonas');
  jon.style.width = jw + 'px';
  const vink = Math.sin((t - 29.6) * 7) * 3 * P(t, 29.6, 29.9);
  jon.style.transformOrigin = '50% 100%';
  jon.style.transform = `translate(${(540 - jw + 20).toFixed(1)}px, ${(960 - jh + 60 + (1 - jp) * 660 - studs).toFixed(1)}px) rotate(${vink.toFixed(2)}deg)`;
  jon.style.opacity = P(t, 28.95, 29.1).toFixed(3);
  // Texten.
  const tl = (e, t0, y) => {
    const p = P(t, t0 - 0.05, t0 + 0.35);
    put(e, 270, y + 26 * (1 - E.outCubic(p)), lerp(0.85, 1, E.spring(p)), 0, E.outCubic(p));
  };
  tl(slutEls.lycka, 29.62, 200);
  tl(slutEls.sondag, 30.48, 276);
  const pp = E.spring(P(t, 30.72, 31.22));
  put($('slutPill'), 270, 382 + (1 - pp) * 20, lerp(0.6, 1, pp), 0, P(t, 30.72, 30.82));
  // Konfetti.
  for (const c of confetti) {
    const dt = t - c.t0;
    if (dt < 0) { c.e.style.visibility = 'hidden'; continue; }
    c.e.style.visibility = 'visible';
    const x = c.x0 + c.vx * dt, y = c.y0 + c.vy * dt + 0.5 * 900 * dt * dt;
    c.e.style.transform = `translate(${x.toFixed(1)}px, ${y.toFixed(1)}px) rotate(${(c.rot + c.vr * dt).toFixed(1)}deg) rotateX(${(dt * 400 % 360).toFixed(1)}deg)`;
  }
}
